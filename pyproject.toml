[project]
name = "talos-sdk-py"
version = "0.1.16"
description = "Talos Protocol Python SDK"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pydantic",
    "cryptography"
]

[project.scripts]
talos-sdk = "talos_sdk.conformance.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
