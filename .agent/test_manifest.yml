manifest_version: v1
repo_id: sdks-python
entrypoints:
  unit: "scripts/test.sh unit"
  lint: "scripts/test.sh lint"
  typecheck: "scripts/test.sh typecheck"
interop:
  enabled: true
  command: "scripts/test.sh interop"
  contracts_pin:
    type: "artifact"
    name: "talos-contracts"
    version: "1.2.3"
  required: true
coverage:
  tool: "pytest-cov"
  reports:
    xml: "coverage.xml"
  thresholds:
    unit:
      line: 0.80
    critical_paths:
      - path: "src/talos_sdk/crypto/**"
        line: 0.90
